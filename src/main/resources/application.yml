spring:
  application:
    name: be-interview-prep
  datasource:
    url: jdbc:h2:mem:interviewdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    # Keep lazy loading inside the service/transaction boundary, not the web layer.
    open-in-view: false
  data:
    web:
      pageable:
        # Larger requested page sizes are capped to this value.
        max-page-size: 100

app:
  jwt:
    # Required. Base64-encoded HMAC-SHA256 key of at least 256 bits, e.g. `openssl rand -base64 32`.
    # Supplied via environment variable only; never commit a real value.
    secret: ${JWT_SECRET}
    expiry: 15m
  admin:
    # Optional. When both are set, an ADMIN account is created at startup if it does not exist yet.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
